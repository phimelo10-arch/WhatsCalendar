<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" /> <!-- Verde Esmeralda (Whats) -->
      <stop offset="100%" stop-color="#0EA5E9" /> <!-- Azul/Ciano (Tecnologia/Premium) -->
    </linearGradient>
  </defs>

  <!-- Ícone desenhado apenas em linhas (vazado), sem preenchimento sólido -->
  <g stroke="url(#gradMain)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Corpo do calendário -->
    <rect x="8" y="12" width="32" height="28" rx="8" />
    <!-- Argolas -->
    <path d="M16 5v10M32 5v10" />
    <!-- Linha divisória -->
    <path d="M8 23h32" />
    <!-- Postagem (linha interna) -->
    <path d="M18 32h12" />
  </g>
</svg>